name: Spotless on Commit

on:
  push:
    branches: [ "**" ] # every branch on every commit
  pull_request:

jobs:
  spotless:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Spotless Check
        run: ./gradlew spotlessCheck
